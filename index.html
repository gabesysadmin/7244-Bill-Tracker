<!DOCTYPE html>
<html>
<head>
    <title>Family Bill Tracker</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="styles.css">

    <link rel="manifest"
          href="manifest.json">

</head>
<body>

<h1>Family Bill Tracker</h1>

<form id="billForm">

    <input
        id="person"
        placeholder="Family Member"
        required>

    <input
        id="billName"
        placeholder="Bill Name"
        required>

    <input
        type="number"
        id="amount"
        placeholder="Amount"
        required>

    <input
        type="date"
        id="dueDate"
        required>

    <button type="submit">
        Add Bill
    </button>

</form>

<hr>

<div id="billList"></div>

<script type="module" src="app.js"></script>
</script>

</body>
</html>
