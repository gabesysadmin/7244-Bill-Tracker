<!DOCTYPE html>
<html>

<head>

    <title>Family Bill Tracker</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="styles.css">

    <link rel="manifest"
          href="manifest.json">

</head>

<body>

    <h1>Family Bill Tracker</h1>

    <div id="loginSection">

        <h2>Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button id="loginBtn">
            Login
        </button>

    </div>

    <div id="appSection" style="display:none;">
    <button onclick="logout()">Logout</button>

        <div class="dashboard">

            <div class="stat-card">
                <h3>Outstanding</h3>
                <span id="outstandingTotal">$0.00</span>
            </div>

            <div class="stat-card">
                <h3>Overdue</h3>
                <span id="overdueCount">0</span>
            </div>

            <div class="stat-card">
                <h3>Paid</h3>
                <span id="paidCount">0</span>
            </div>

        </div>

        <form id="billForm">

            <select id="assignedTo" required>
    <option value="">
        Select Family Member
    </option>
</select>

            <input
                id="billName"
                placeholder="Bill Name"
                required>

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                required>

            <input
                type="date"
                id="dueDate"
                required>

            <button type="submit">
                Add Bill
            </button>

        </form>

        <hr>

        <div id="billList"></div>

    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
