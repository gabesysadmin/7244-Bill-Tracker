<!DOCTYPE html>
<html>

<head>
    <title>7244 Statesman Blvd - Bill Tracker</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="styles.css">

    <link rel="manifest"
          href="manifest.json">

</head>

<body>

    <h1>7244 Statesman Blvd - Bill Tracker</h1>

    <div id="loginSection">

    <div class="login-card">

        <h2>Welcome Back</h2>

        <p class="login-subtitle">
            Sign in to manage family bills and reminders
        </p>

        <label class="field-label">
            Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <label class="field-label">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button id="loginBtn">
            Login
        </button>

    </div>

</div>

    <div id="appSection" style="display:none;">

        <h2 id="welcomeMessage"></h2>
        <div id="lastLoginInfo"></div>
        <div id="adminTabs" class="admin-tabs">
    <button id="homeTab" class="tab-btn active">
        Home
    </button>

    <button id="addBillTab" class="tab-btn">
        Add Bill
    </button>

    <button id="activityTab" class="tab-btn">
        User Activity
    </button>
</div>

<div class="top-toolbar">

    <button onclick="logout()">
        Logout
    </button>

    <button id="enableNotificationsBtn">
        Enable Notifications
    </button>

    <button id="toggleArchivedBtn">
        Show Archived
    </button>

</div>

        <div class="dashboard">

            <div class="stat-card">
                <h3>Outstanding</h3>
                <span id="outstandingTotal">$0.00</span>
            </div>

            <div class="stat-card">
                <h3>Overdue</h3>
                <span id="overdueCount">0</span>
            </div>

            <div class="stat-card">
                <h3>Paid</h3>
                <span id="paidCount">0</span>
            </div>

            <div class="stat-card">
                <h3>Due This Week</h3>
                <span id="dueThisWeek">0</span>
            </div>

            <div class="stat-card">
                <h3>Recurring</h3>
                <span id="recurringCount">0</span>
            </div>

        </div>

        <div class="filters">

            <select id="statusFilter">
                <option value="all">All Bills</option>
                <option value="overdue">Overdue</option>
                <option value="due">Due Soon</option>
                <option value="paid">Paid</option>
                <option value="recurring">Recurring</option>
            </select>

            <select id="personFilter">
                <option value="all">All Family Members</option>
            </select>

            <button id="toggleArchivedBtn">
    Show Archived
</button>

        </div>

        <div id="addBillSection" style="display:none;">
        <form id="billForm">

    <div class="form-header">
        <h3>Add New Bill</h3>
    </div>

    <label class="field-label">
        Family Member
    </label>

    <select id="assignedTo" required>
        <option value="">
            Select Family Member
        </option>
    </select>

    <label class="field-label">
        Bill Name
    </label>

    <input
        id="billName"
        placeholder="Phone Bill"
        required>

    <label class="field-label">
        Amount
    </label>

    <input
        type="number"
        id="amount"
        placeholder="95.00"
        step="0.01"
        required>

    <label class="field-label">
        Due Date
    </label>

    <input
        type="date"
        id="dueDate"
        required>

    <label class="field-label">
        Notes
    </label>

    <textarea
        id="notes"
        placeholder="Optional notes..."
        rows="4"></textarea>

    <div class="recurring-row">

        <input
            type="checkbox"
            id="recurring">

        <label for="recurring">
            Recurring Monthly
        </label>

    </div>

    <button
        type="submit"
        class="add-bill-btn">

        Add Bill

    </button>

</form>
        </div>

        <hr>

<div id="billList"></div>

<div id="activitySection" style="display:none;">
    <h2>User Activity</h2>

    <table class="activity-table">
        <thead>
            <tr>
    <th>User</th>
    <th>Last Login</th>
    <th>Days Ago</th>
    <th>Notifications</th>
    <th>Last Reminder</th>
</tr>
        </thead>

        <tbody id="activityTableBody">
        </tbody>
    </table>
</div>

</div>

<div id="editModal" class="modal">

    <div class="modal-content">

        <h2>Edit Bill</h2>

        <input
            type="hidden"
            id="editBillId">

        <input
            id="editBillName"
            placeholder="Bill Name">

        <input
            type="number"
            id="editAmount"
            placeholder="Amount"
            step="0.01">

        <input
            type="date"
            id="editDueDate">

        <textarea
            id="editNotes"
            placeholder="Notes"
            rows="4"></textarea>

        <label>
            <input
                type="checkbox"
                id="editRecurring">

            Recurring Monthly
        </label>

        <div class="modal-buttons">

            <button id="saveEditBtn">
                Save Changes
            </button>

            <button
                id="cancelEditBtn"
                class="delete-btn">

                Cancel

            </button>

        </div>

    </div>

</div>
    <script type="module" src="app.js"></script>

</body>

</html>
