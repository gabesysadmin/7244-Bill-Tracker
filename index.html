<!DOCTYPE html>
<html>

<head>
    <title>Family Bill Tracker</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="styles.css">

    <link rel="manifest"
          href="manifest.json">

</head>

<body>

    <h1>Family Bill Tracker</h1>

    <div id="loginSection">

        <h2>Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button id="loginBtn">
            Login
        </button>

    </div>

    <div id="appSection" style="display:none;">

        <h2 id="welcomeBanner"></h2>

        <button onclick="logout()">
            Logout
        </button>

        <button id="enableNotificationsBtn">
    Enable Notifications
</button>

        <div class="dashboard">

            <div class="stat-card">
                <h3>Outstanding</h3>
                <span id="outstandingTotal">$0.00</span>
            </div>

            <div class="stat-card">
                <h3>Overdue</h3>
                <span id="overdueCount">0</span>
            </div>

            <div class="stat-card">
                <h3>Paid</h3>
                <span id="paidCount">0</span>
            </div>

            <div class="stat-card">
                <h3>Due This Week</h3>
                <span id="dueThisWeek">0</span>
            </div>

            <div class="stat-card">
                <h3>Recurring</h3>
                <span id="recurringCount">0</span>
            </div>

        </div>

        <div class="filters">

            <select id="statusFilter">
                <option value="all">All Bills</option>
                <option value="overdue">Overdue</option>
                <option value="due">Due Soon</option>
                <option value="paid">Paid</option>
                <option value="recurring">Recurring</option>
            </select>

            <select id="personFilter">
                <option value="all">All Family Members</option>
            </select>

            <button id="toggleArchivedBtn">
    Show Archived
</button>

        </div>

        <form id="billForm">

            <select id="assignedTo" required>
                <option value="">
                    Select Family Member
                </option>
            </select>

            <input
                id="billName"
                placeholder="Bill Name"
                required>

            <input
                type="number"
                id="amount"
                placeholder="Amount"
                step="0.01"
                required>

            <input
                type="date"
                id="dueDate"
                required>

            <textarea
                id="notes"
                placeholder="Notes (optional)"
                rows="3"></textarea>

            <label>
                <input
                    type="checkbox"
                    id="recurring">
                Recurring Monthly
            </label>

            <button type="submit">
                Add Bill
            </button>

        </form>

        <hr>

        <div id="billList"></div>

    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
